services:
  ngala-db:
    build:
      context: ./Database
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ngala_farms}
      POSTGRES_USER: ${POSTGRES_USER:-ngala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ngala_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - ngala-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ngala-network

  ngala-api:
    build:
      context: .
      dockerfile: backend/API/Dockerfile
    ports:
      - "5001:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      DatabaseProvider: Postgres
      ConnectionStrings__DefaultConnection: Host=ngala-db;Port=5432;Database=${POSTGRES_DB:-ngala_farms};Username=${POSTGRES_USER:-ngala};Password=${POSTGRES_PASSWORD:-ngala_dev_password}
      JwtSettings__SecretKey: ${JWT_SECRET:-NgalaFarmsSecretKey2026!PalmOilAndCattleXAF!}
    depends_on:
      ngala-db:
        condition: service_healthy
    networks:
      - ngala-network

  ngala-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - ngala-api
    networks:
      - ngala-network

volumes:
  ngala-postgres-data:

networks:
  ngala-network:
    driver: bridge
